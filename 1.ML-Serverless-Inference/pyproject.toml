[project]
name = "1-ml-serverless-inference"
version = "0.1.0"
description = ""
authors = [
    {name = "Gihan-Liyanage"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn (==1.9.0)",
    "pandas (>=2.2,<3.0)",
    "boto3 (>=1.34,<2.0)",
    "pydantic (>=2.7,<3.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
