[project]
name = "2-ml-training-pipeline"
version = "0.1.0"
description = ""
authors = [
    {name = "Gihan-Liyanage"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sagemaker (>=2.257,<3.0)",
    "boto3 (>=1.34,<2.0)",
    "pandas (>=2.2)",
    "scikit-learn (>=1.4)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
moto = {version = ">=5.0,<6.0", extras = ["s3"]}

[tool.pytest.ini_options]
pythonpath = [".", "pipeline/code"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
